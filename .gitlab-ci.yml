# GitLab CI/CD — translated from .github/workflows/build.yml, which is left in
# place so the project still builds on GitHub.
#
# Builds the Fabric mod jar and the standalone installer on every version tag and
# attaches both to a GitLab Release. The only Minecraft code that ever ships is
# none: the mod jar carries no repackaged game, and the installer downloads Fabric
# and the jar on the player's own machine, per the project ground rules.
#
# Tags only. Ordinary commits to main do not build: this is a personal client with a
# tag-driven release flow, so a run per commit is spend with nothing to publish at the
# end of it. A manual "Run pipeline" from the UI stays possible so the pipeline can be
# exercised without inventing a throwaway tag.
#
# Runners: everything except the Windows launcher runs on the container runners (tag `docker`).
# The Windows launcher builds on the dedicated shell runner (tag `windows`), which is a plain
# machine with Git on it and no container image, so that job installs its own toolchain and is
# written in PowerShell rather than sh. macOS still has no runner, so that launcher stays parked.
#
# One difference from the GitHub original: there, `build` and `installer` each called
# softprops/action-gh-release and had to be serialised so they did not race to create
# the same release. GitLab creates a release from one job, so both build jobs simply
# publish their files to the generic package registry and a single `release` job links
# them — no serialisation needed, and the two builds run in parallel.

stages:
  - build
  - image
  - release

variables:
  PACKAGE_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/esdeath-cryostasis/${CI_COMMIT_TAG}"

.tag_or_manual:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "web"

build:
  extends: .tag_or_manual
  stage: build
  tags: [docker]
  image: eclipse-temurin:21-jdk
  script:
    - chmod +x ./gradlew
    - ./gradlew build --no-daemon
    # Staged by an explicit name test rather than a glob. The obvious shorthand for "not
    # the sources jar", build/libs/*[!sources].jar, is a character class that happens to
    # work: it matches one trailing character outside {s,o,u,r,c,e}, so a version ending
    # in any of those letters (0.3.0-pre) would silently exclude the mod jar itself and
    # fail the release.
    - |
      set -eu
      mkdir -p dist
      find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' -exec cp {} dist/ \;
      ls -1 dist
    # On a tag, hand the jar to the package registry so the release can link it.
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        for f in dist/*.jar; do
          curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" \
            --upload-file "$f" "$PACKAGE_URL/$(basename "$f")"
        done
      fi
  artifacts:
    name: esdeath-cryostasis
    # The runnable mod jar only, no sources jar.
    paths:
      - dist/*.jar
    expire_in: 30 days

# The setup installer is a separate artifact: a static Go binary that installs the desktop
# launcher as a regular Windows app (into the user's programs folder, with shortcuts and an
# Add/Remove Programs entry) and then the launcher installs the mod. It needs no Java, and no
# Inno Setup or other toolchain — just `go build`. Windows only, because the Add/Remove
# Programs install-and-uninstall model it implements has no meaning elsewhere; Linux and macOS
# users run the launcher binary directly.
#
# It builds from the repository root, not installer/, because the download and release logic
# lives in the shared internal/engine package (the launcher shares it), and the engine's tests
# only run when `go test ./...` is invoked from the module root. Vet and test run on this Linux
# runner and still cover the installer: its Windows-only logic sits behind build tags with a
# compiled non-Windows stub, so the package builds and is vetted here before it is cross-built.
installer:
  extends: .tag_or_manual
  stage: build
  tags: [docker]
  image: golang:1.23
  script:
    - go vet ./...
    - go test ./...
    # Windows amd64 only: the setup binary installs a Windows desktop app. Cross-built from
    # this Linux runner (CGO_ENABLED=0, pure Go), so no Windows runner is needed just for this.
    - |
      set -eu
      mkdir -p installer/dist
      GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
        go build -trimpath -ldflags '-s -w' -o installer/dist/EsdeathCryostasisSetup.exe ./installer
      ls -1 installer/dist
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        for f in installer/dist/*; do
          curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" \
            --upload-file "$f" "$PACKAGE_URL/$(basename "$f")"
        done
      fi
  artifacts:
    name: esdeath-installer
    paths:
      - installer/dist/*
    expire_in: 30 days

# The desktop launcher is a Wails app: a native GUI binary per platform, so unlike the
# cross-compiled installer it has to be built on each OS natively (each needs its own webview
# and toolchain). It lives in its own Go module (launcher/) with the Wails dependency, kept
# apart from the installer's dependency-free build.
#
# This template covers the two platforms that are not part of a release. macOS is still parked
# for want of a runner: it is kept, tagged and manual, so it neither blocks a pipeline nor gets
# lost — register a runner with the `macos` tag and it works as written. The Linux one is manual
# purely to keep the siblings symmetrical; it will run on the container runner as-is.
#
# Windows is not built from this template. It runs on a shell runner rather than a container,
# so it needs its own PowerShell script and toolchain bootstrap, and it is the only launcher
# that ships in the release; it is spelled out in full below.
.launcher:
  extends: .tag_or_manual
  stage: build
  when: manual
  allow_failure: true
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - cd launcher
    # Pinned to the version the go.mod requires so the CLI and the runtime never drift apart.
    - go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
    - export PATH="$(go env GOPATH)/bin:$PATH"
    # wails build runs the frontend install and build first (per wails.json), then the Go
    # build with the embedded dist, then packages the native binary into build/bin.
    - wails build -platform $PLATFORM -tags webkit2_41 -clean -o esdeath-cryostasis-launcher
  artifacts:
    paths:
      - launcher/build/bin/*

launcher:linux:
  extends: .launcher
  tags: [docker]
  image: golang:1.23
  variables:
    PLATFORM: linux/amd64
  before_script:
    # Linux is the only platform whose webview is not part of the OS: Wails renders through
    # WebKitGTK, so its dev packages have to be installed before the build. -tags webkit2_41
    # then switches Wails from its default 4.0 bindings to the 4.1 package installed here.
    - apt-get update && apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev nodejs npm

# The Windows launcher, built on the dedicated shell runner and attached to the release. This is
# the launcher the setup installer downloads on the player's machine, so unlike its parked
# siblings it is a required job: if it fails, no release is created.
#
# A shell runner has no image to declare a toolchain in, and this one carries nothing but Git, so
# the job installs Go, Node and the Wails CLI itself. They go to a directory outside the build
# tree that survives between pipelines, so only the first run after a version change pays the
# download. Set ESDEATH_CI_TOOLS as a CI variable to put that directory somewhere else.
#
# The series are pinned rather than the exact patches, so this floats the same way `image:
# golang:1.23` and `node-version: '20'` float for the container jobs.
launcher:windows:
  extends: .tag_or_manual
  stage: build
  tags: [windows]
  variables:
    GIT_SUBMODULE_STRATEGY: none
    GO_SERIES: "1.23"
    NODE_SERIES: "20"
    # Pinned to the version the launcher's go.mod requires so the CLI and the runtime never
    # drift apart.
    WAILS_VERSION: "v2.13.0"
    # The name the release carries. engine.LauncherAsset matches on "launcher" plus the OS
    # token, so this name is what lets the installer find the binary in a release.
    LAUNCHER_ASSET: "esdeath-launcher-windows-amd64.exe"
  script:
    - |
      # $ErrorActionPreference is deliberately left at its default. Set to Stop, Windows
      # PowerShell turns anything a native command writes to stderr into a terminating error,
      # and go, npm and wails all report progress there — the build would fail on its own
      # console output. Failure is caught explicitly instead: -ErrorAction Stop on the cmdlets
      # that must not fail quietly, exit codes on the commands, and throw on everything else.
      #
      # The progress bar costs more than the download itself in a non-interactive shell, and
      # Windows PowerShell 5.1 does not negotiate TLS 1.2 unless it is asked to.
      $ProgressPreference = 'SilentlyContinue'
      if ($PSVersionTable.PSVersion.Major -lt 6) {
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
      }

      # PowerShell does not fail a script when a native command exits non-zero, and GitLab only
      # checks the exit status at the end of each script block, so the build steps are checked
      # by hand rather than trusting either.
      function Invoke-Checked([string] $what, [scriptblock] $action) {
        & $action
        if ($LASTEXITCODE -ne 0) { throw "$what failed with exit code $LASTEXITCODE" }
      }

      $tools = if ($env:ESDEATH_CI_TOOLS) { $env:ESDEATH_CI_TOOLS } else { Join-Path $env:USERPROFILE 'esdeath-ci-tools' }
      New-Item -ItemType Directory -Force -Path $tools -ErrorAction Stop | Out-Null

      # Go. The index lists newest first and needs include=all to reach a series that is no
      # longer one of the two current ones.
      $goVersion = (Invoke-RestMethod "https://go.dev/dl/?mode=json&include=all" -UseBasicParsing -ErrorAction Stop |
        Where-Object { $_.stable -and ($_.version -eq "go$env:GO_SERIES" -or $_.version -like "go$env:GO_SERIES.*") } |
        Select-Object -First 1).version
      if (-not $goVersion) { throw "go.dev lists no stable Go $env:GO_SERIES release" }
      $goRoot = Join-Path $tools $goVersion
      if (-not (Test-Path (Join-Path $goRoot 'bin\go.exe'))) {
        $zip = Join-Path $env:TEMP "$goVersion.windows-amd64.zip"
        $staging = Join-Path $env:TEMP "go-unpack-$env:CI_JOB_ID"
        Invoke-WebRequest "https://go.dev/dl/$goVersion.windows-amd64.zip" -OutFile $zip -UseBasicParsing -ErrorAction Stop
        if (Test-Path $goRoot) { Remove-Item -Recurse -Force $goRoot }
        Expand-Archive -Path $zip -DestinationPath $staging -Force -ErrorAction Stop
        # The archive unpacks a bare go/ directory; name it for its version so a patch bump
        # installs alongside rather than on top of what is already there.
        Move-Item (Join-Path $staging 'go') $goRoot -ErrorAction Stop
        Remove-Item -Recurse -Force $staging, $zip
        # Then drop the older patches, so the runner does not collect a toolchain per release.
        Get-ChildItem $tools -Directory -Filter 'go1.*' | Where-Object { $_.Name -ne $goVersion } | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
      }
      $env:GOROOT = $goRoot
      $env:PATH = "$goRoot\bin;$env:PATH"

      # Node, for the Svelte frontend that wails build compiles before the Go build.
      $nodeVersion = (Invoke-RestMethod 'https://nodejs.org/dist/index.json' -UseBasicParsing -ErrorAction Stop |
        Where-Object { $_.version -like "v$env:NODE_SERIES.*" } |
        Select-Object -First 1).version
      if (-not $nodeVersion) { throw "nodejs.org lists no Node $env:NODE_SERIES release" }
      $nodeDir = Join-Path $tools "node-$nodeVersion-win-x64"
      if (-not (Test-Path (Join-Path $nodeDir 'node.exe'))) {
        $zip = Join-Path $env:TEMP "node-$nodeVersion-win-x64.zip"
        # This archive already carries its versioned directory, so it unpacks straight into place.
        Invoke-WebRequest "https://nodejs.org/dist/$nodeVersion/node-$nodeVersion-win-x64.zip" -OutFile $zip -UseBasicParsing -ErrorAction Stop
        Expand-Archive -Path $zip -DestinationPath $tools -Force -ErrorAction Stop
        Remove-Item -Force $zip
        Get-ChildItem $tools -Directory -Filter 'node-v*-win-x64' | Where-Object { $_.Name -ne "node-$nodeVersion-win-x64" } | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
      }
      $env:PATH = "$nodeDir;$env:PATH"

      # Keep the module cache and the Wails binary with the rest of the toolchain, so a rebuild
      # does not re-download the dependency tree. The stamp file carries the pinned version, so
      # changing WAILS_VERSION reinstalls and an unchanged one costs nothing.
      $env:GOPATH = Join-Path $tools 'gopath'
      $env:PATH = "$env:GOPATH\bin;$env:PATH"
      $stamp = Join-Path $tools "wails-$env:WAILS_VERSION.installed"
      if (-not (Test-Path $stamp)) {
        Invoke-Checked 'go install wails' { go install "github.com/wailsapp/wails/v2/cmd/wails@$env:WAILS_VERSION" }
        New-Item -ItemType File -Path $stamp -Force | Out-Null
      }
      go version
      node --version
      wails version
    - |
      Set-Location (Join-Path $env:CI_PROJECT_DIR 'launcher')
      # wails build runs the frontend install and build first (per wails.json), then the Go build
      # with the embedded dist, then packages the native binary into build/bin. The Linux job's
      # -tags webkit2_41 is not passed here: it exists only to switch WebKitGTK bindings, and the
      # Windows webview is part of the OS.
      Invoke-Checked 'wails build' { wails build -platform windows/amd64 -clean -o esdeath-cryostasis-launcher }

      $bin = Join-Path (Get-Location) 'build\bin'
      # -o is documented to set the output name verbatim, so the binary lands without an .exe
      # extension; take whatever is actually there rather than depending on that staying true.
      $built = Get-ChildItem -Path $bin -File -Filter 'esdeath-cryostasis-launcher*' | Select-Object -First 1
      if (-not $built) { throw "wails build produced no launcher binary in $bin" }
      Move-Item -Force $built.FullName (Join-Path $bin $env:LAUNCHER_ASSET) -ErrorAction Stop
      Get-ChildItem $bin | Select-Object Name, Length
    - |
      # On a tag, hand the binary to the package registry so the release job can link it.
      if ($env:CI_COMMIT_TAG) {
        $asset = Join-Path $env:CI_PROJECT_DIR "launcher\build\bin\$env:LAUNCHER_ASSET"
        Invoke-WebRequest -Method Put -Uri "$env:PACKAGE_URL/$env:LAUNCHER_ASSET" -Headers @{ 'JOB-TOKEN' = $env:CI_JOB_TOKEN } -InFile $asset -UseBasicParsing -ErrorAction Stop | Out-Null
        Write-Host "Uploaded $env:LAUNCHER_ASSET to $env:PACKAGE_URL"
      }
  artifacts:
    name: esdeath-launcher-windows
    paths:
      - launcher/build/bin/esdeath-launcher-windows-amd64.exe
    expire_in: 30 days

launcher:macos:
  extends: .launcher
  tags: [macos]
  variables:
    PLATFORM: darwin/universal

# The backend container is the third shippable, and the odd one out: it does not attach to
# the release, it publishes to the container registry so a `docker compose pull` can redeploy
# it. It is independent of the mod jar, so it runs alongside build/installer.
#
# NOTE: the image moved off ghcr.io with the GitLab migration; ~/cryostasis-deploy on
# crimsonswarm01 now points at the path below.
backend-image:
  extends: .tag_or_manual
  stage: image
  tags: [docker]
  image: docker:28-cli
  services:
    - docker:28-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  needs: []
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    # Gate the image on the suite the same way the mod ships behind `gradle build`: a broken
    # backend must never reach `:latest`, because a redeploy pulls that tag blind. The suite
    # needs no database - it runs against repo/memory.py.
    - docker run --rm -v "$CI_PROJECT_DIR/backend:/src" -w /src python:3.12-slim sh -c "pip install -e '.[dev]' && pytest"
    - export REF="$CI_REGISTRY_IMAGE/cryostasis-backend"
    # On a v* tag: 1.2.3, 1.2, and latest. A manual run produces no tags and does not push
    # (see the guard below), so it only validates that the image still builds.
    - TAGS="--tag $REF:ci"
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        VER="${CI_COMMIT_TAG#v}"
        MINOR="$(echo "$VER" | cut -d. -f1,2)"
        TAGS="--tag $REF:$VER --tag $REF:$MINOR --tag $REF:latest"
      fi
    - docker build $TAGS backend
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        VER="${CI_COMMIT_TAG#v}"
        MINOR="$(echo "$VER" | cut -d. -f1,2)"
        docker push "$REF:$VER"; docker push "$REF:$MINOR"; docker push "$REF:latest"
      else
        echo "No tag — image built but not pushed (matches the GitHub dispatch behaviour)."
      fi

release:
  stage: release
  tags: [docker]
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  needs:
    - build
    - installer
    - launcher:windows
  script:
    - echo "Creating the GitLab release for $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: "Esdeath Cryostasis $CI_COMMIT_TAG"
    assets:
      links:
        - name: EsdeathCryostasisSetup.exe
          url: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/esdeath-cryostasis/${CI_COMMIT_TAG}/EsdeathCryostasisSetup.exe
          link_type: package
        - name: esdeath-launcher-windows-amd64.exe
          url: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/esdeath-cryostasis/${CI_COMMIT_TAG}/esdeath-launcher-windows-amd64.exe
          link_type: package
        # The mod jar's filename carries the version, so it is linked through the
        # package registry's directory listing rather than guessed here.
        - name: Mod jar and all release files
          url: ${CI_PROJECT_URL}/-/packages
          link_type: other
