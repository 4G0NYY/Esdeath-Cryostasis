# GitLab CI/CD, translated from .github/workflows/build.yml, which is left in
# place so the project still builds on GitHub.
#
# Builds the Fabric mod jar and the standalone installer on every version tag and
# attaches both to a GitLab Release. The only Minecraft code that ever ships is
# none: the mod jar carries no repackaged game, and the installer downloads Fabric
# and the jar on the player's own machine, per the project ground rules.
#
# Tags only. Ordinary commits to main do not build: this is a personal client with a
# tag-driven release flow, so a run per commit is spend with nothing to publish at the
# end of it. A manual "Run pipeline" from the UI stays possible so the pipeline can be
# exercised without inventing a throwaway tag.
#
# Runners: everything runs on the container runners (tag `docker`). The Windows launcher used to
# build natively on a shell runner (tag `windows`) that bootstrapped its own toolchain in
# PowerShell; it now cross-compiles alongside the setup installer, so no Windows machine is in
# the loop and that runner is free. macOS still has no runner, so that launcher stays parked.
#
# One difference from the GitHub original: there, `build` and `installer` each called
# softprops/action-gh-release and had to be serialised so they did not race to create
# the same release. GitLab creates a release from one job, so both build jobs simply
# publish their files to the generic package registry and a single `release` job links
# them, so no serialisation is needed and the two builds run in parallel.

stages:
  - build
  - image
  - release

variables:
  PACKAGE_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/esdeath-cryostasis/${CI_COMMIT_TAG}"

.tag_or_manual:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "web"

build:
  extends: .tag_or_manual
  stage: build
  tags: [docker]
  image: eclipse-temurin:21-jdk
  script:
    - chmod +x ./gradlew
    - ./gradlew build --no-daemon
    # Staged by an explicit name test rather than a glob. The obvious shorthand for "not
    # the sources jar", build/libs/*[!sources].jar, is a character class that happens to
    # work: it matches one trailing character outside {s,o,u,r,c,e}, so a version ending
    # in any of those letters (0.3.0-pre) would silently exclude the mod jar itself and
    # fail the release.
    - |
      set -eu
      mkdir -p dist
      find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' -exec cp {} dist/ \;
      ls -1 dist
    # On a tag, hand the jar to the package registry so the release can link it.
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        for f in dist/*.jar; do
          curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" \
            --upload-file "$f" "$PACKAGE_URL/$(basename "$f")"
        done
      fi
    # The jar's filename carries the version, so the release job cannot spell it out in a
    # static link. Hand it over as a dotenv variable instead, which is the only way a later
    # job learns something a previous one worked out.
    - |
      set -eu
      jar="$(find dist -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n 1)"
      test -n "$jar"
      echo "MOD_JAR=$(basename "$jar")" > build.env
      cat build.env
  artifacts:
    reports:
      dotenv: build.env
    name: esdeath-cryostasis
    # The runnable mod jar only, no sources jar.
    paths:
      - dist/*.jar
    expire_in: 30 days

# The setup installer is a separate artifact: a static Go binary that installs the desktop
# launcher as a regular Windows app (into the user's programs folder, with shortcuts and an
# Add/Remove Programs entry) and then the launcher installs the mod. It needs no Java, and no
# Inno Setup or other toolchain, just `go build`. Windows only, because the Add/Remove
# Programs install-and-uninstall model it implements has no meaning elsewhere; Linux and macOS
# users run the launcher binary directly.
#
# It builds from the repository root, not installer/, because the download and release logic
# lives in the shared internal/engine package (the launcher shares it), and the engine's tests
# only run when `go test ./...` is invoked from the module root. Vet and test run on this Linux
# runner and still cover the installer: its Windows-only logic sits behind build tags with a
# compiled non-Windows stub, so the package builds and is vetted here before it is cross-built.
installer:
  extends: .tag_or_manual
  stage: build
  tags: [docker]
  image: golang:1.23
  script:
    - go vet ./...
    - go test ./...
    # Windows amd64 only: the setup binary installs a Windows desktop app. Cross-built from
    # this Linux runner (CGO_ENABLED=0, pure Go), so no Windows runner is needed just for this.
    - |
      set -eu
      mkdir -p installer/dist
      GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
        go build -trimpath -ldflags '-s -w' -o installer/dist/EsdeathCryostasisSetup.exe ./installer
      ls -1 installer/dist
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        for f in installer/dist/*; do
          curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" \
            --upload-file "$f" "$PACKAGE_URL/$(basename "$f")"
        done
      fi
  artifacts:
    name: esdeath-installer
    paths:
      - installer/dist/*
    expire_in: 30 days

# The desktop launcher is a Wails app: a native GUI binary per platform, so unlike the
# cross-compiled installer it has to be built on each OS natively (each needs its own webview
# and toolchain). It lives in its own Go module (launcher/) with the Wails dependency, kept
# apart from the installer's dependency-free build.
#
# This template covers the two platforms that are not part of a release. macOS is still parked
# for want of a runner: it is kept, tagged and manual, so it neither blocks a pipeline nor gets
# lost: register a runner with the `macos` tag and it works as written. The Linux one is manual
# purely to keep the siblings symmetrical; it will run on the container runner as-is.
#
# Windows is not built from this template either. It is the only launcher that ships in a
# release, and it is cross-compiled without the Wails CLI rather than built natively, so it
# shares none of the steps above; it is spelled out in full below.
.launcher:
  extends: .tag_or_manual
  stage: build
  when: manual
  allow_failure: true
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - cd launcher
    # Pinned to the version the go.mod requires so the CLI and the runtime never drift apart.
    - go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
    - export PATH="$(go env GOPATH)/bin:$PATH"
    # wails build runs the frontend install and build first (per wails.json), then the Go
    # build with the embedded dist, then packages the native binary into build/bin.
    - wails build -platform $PLATFORM -tags webkit2_41 -clean -o esdeath-cryostasis-launcher
  artifacts:
    paths:
      - launcher/build/bin/*

launcher:linux:
  extends: .launcher
  tags: [docker]
  # As in launcher:windows, 1.25 is what launcher/go.mod asks for.
  image: golang:1.25
  variables:
    PLATFORM: linux/amd64
  before_script:
    # Linux is the only platform whose webview is not part of the OS: Wails renders through
    # WebKitGTK, so its dev packages have to be installed before the build. -tags webkit2_41
    # then switches Wails from its default 4.0 bindings to the 4.1 package installed here.
    - apt-get update && apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev nodejs npm

# The Windows launcher, and the only launcher that ships in a release: it is what the setup
# installer downloads on the player's machine, so unlike its parked siblings it is a required
# job, and if it fails no release is created.
#
# It is not built from the template above, and it no longer builds on Windows at all. Wails'
# Windows backend is pure Go - the webview is an OS component driven over COM, so nothing here
# needs cgo - which means the launcher cross-compiles from the container runner exactly the way
# the setup installer already does, and the shell runner drops out of the pipeline.
#
# It also does not use the Wails CLI. `wails build` is a wrapper: it runs the frontend build
# declared in wails.json, regenerates the frontend/wailsjs bindings, compiles a Windows resource
# file, and then calls `go build` with a fixed set of flags. Everything but the bindings is
# reproduced below. The bindings are dead weight for this project: the frontend reaches Go
# through the hand-written typed bridge in frontend/src/lib/bridge.ts, over the window.go and
# window.runtime globals the binary injects at runtime, and never imports the generated module,
# which is why it is gitignored and why nothing misses it.
#
# Dropping the CLI is not only a simplification. Installing it compiles an unsigned wails.exe on
# the runner, and Windows Application Control blocks a freshly built binary that carries no
# reputation: that is what broke the v0.6.3 pipeline, where go.exe and node.exe were let through
# and wails.exe was not. Nothing built on the fly is executed here, so there is nothing left for
# such a policy to block.
launcher:windows:
  extends: .tag_or_manual
  stage: build
  tags: [docker]
  # 1.25 because launcher/go.mod asks for it. On an older image the build still worked, by
  # quietly downloading a second toolchain on every run; pinning the image states the version
  # once and keeps the job to the toolchain it declares.
  image: golang:1.25
  variables:
    GIT_SUBMODULE_STRATEGY: none
    # Pinned by hand, the way gradle.properties pins the Fabric versions; nodejs.org/dist lists
    # what exists. Debian's own nodejs is older than the Vite the frontend builds with.
    NODE_VERSION: "v20.20.2"
    # Writes the .syso holding the icon, the DPI-aware GUI manifest and the version block. It is
    # the one part of `wails build` that plain `go build` has no answer for, and without it the
    # launcher would ship with the default Go icon and blur on a scaled display.
    WINRES_VERSION: "v0.3.3"
    # The name the release carries. engine.LauncherAsset matches on "launcher" plus the OS
    # token, so this name is what lets the installer find the binary in a release.
    LAUNCHER_ASSET: "esdeath-launcher-windows-amd64.exe"
  before_script:
    # The .tar.gz rather than the smaller .tar.xz: this image has gzip but no xz-utils.
    - |
      set -eu
      node_dist="node-${NODE_VERSION}-linux-x64"
      curl -fsSL "https://nodejs.org/dist/${NODE_VERSION}/${node_dist}.tar.gz" -o /tmp/node.tar.gz
      mkdir -p /opt/node
      tar -xzf /tmp/node.tar.gz -C /opt/node --strip-components=1
      rm -f /tmp/node.tar.gz
      export PATH="/opt/node/bin:$PATH"
      node --version
      npm --version
  script:
    - cd launcher
    # The Go build embeds frontend/dist, so the frontend is built before the compile rather than
    # alongside it. These are the two steps wails.json declares as frontend:install and
    # frontend:build, with `ci` for `install` because the lockfile is committed.
    - npm --prefix frontend ci
    - npm --prefix frontend run build
    # A Windows version block is four numbers, so the tag loses its leading v and any
    # pre-release suffix. A manual run has no tag to read and stamps 0.0.0.
    - |
      set -eu
      ver="$(printf '%s' "${CI_COMMIT_TAG:-}" | sed 's/^v//; s/-.*$//')"
      test -n "$ver" || ver="0.0.0"
      go run "github.com/tc-hib/go-winres@${WINRES_VERSION}" simply --arch amd64 --manifest gui \
        --icon build/appicon.png --product-name "Esdeath: Cryostasis Launcher" \
        --file-description "Esdeath: Cryostasis Launcher" --copyright "4G0NYY" \
        --original-filename "$LAUNCHER_ASSET" --product-version "$ver" --file-version "$ver"
      test -f rsrc_windows_amd64.syso
    # `go build` links any .syso sitting in the package directory, so the resources above need no
    # flag of their own. The tags and ldflags are the ones Wails v2.13.0 passes for a production
    # desktop build: `production` serves the embedded assets instead of a dev server, and
    # -H windowsgui keeps a console window from opening behind the app.
    - |
      set -eu
      mkdir -p build/bin
      GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
        -tags "desktop,production" -ldflags "-w -s -H windowsgui" \
        -o "build/bin/$LAUNCHER_ASSET" .
      ls -l "build/bin/$LAUNCHER_ASSET"
    # On a tag, hand the binary to the package registry so the release job can link it.
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "build/bin/$LAUNCHER_ASSET" "$PACKAGE_URL/$LAUNCHER_ASSET"
      fi
  artifacts:
    name: esdeath-launcher-windows
    paths:
      - launcher/build/bin/esdeath-launcher-windows-amd64.exe
    expire_in: 30 days

# The backend container is the third shippable, and the odd one out: it does not attach to
# the release, it publishes to the container registry so a `docker compose pull` can redeploy
# it. It is independent of the mod jar, so it runs alongside build/installer.
#
# NOTE: the image moved off ghcr.io with the GitLab migration; ~/cryostasis-deploy on
# crimsonswarm01 now points at the path below.
backend-image:
  extends: .tag_or_manual
  stage: image
  tags: [docker]
  image: docker:28-cli
  services:
    - docker:28-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  needs: []
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    # Gate the image on the suite the same way the mod ships behind `gradle build`: a broken
    # backend must never reach `:latest`, because a redeploy pulls that tag blind. The suite
    # needs no database - it runs against repo/memory.py.
    - docker run --rm -v "$CI_PROJECT_DIR/backend:/src" -w /src python:3.12-slim sh -c "pip install -e '.[dev]' && pytest"
    - export REF="$CI_REGISTRY_IMAGE/cryostasis-backend"
    # On a v* tag: 1.2.3, 1.2, and latest. A manual run produces no tags and does not push
    # (see the guard below), so it only validates that the image still builds.
    - TAGS="--tag $REF:ci"
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        VER="${CI_COMMIT_TAG#v}"
        MINOR="$(echo "$VER" | cut -d. -f1,2)"
        TAGS="--tag $REF:$VER --tag $REF:$MINOR --tag $REF:latest"
      fi
    - docker build $TAGS backend
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        VER="${CI_COMMIT_TAG#v}"
        MINOR="$(echo "$VER" | cut -d. -f1,2)"
        docker push "$REF:$VER"; docker push "$REF:$MINOR"; docker push "$REF:latest"
      else
        echo "No tag, so the image was built but not pushed (matches the GitHub dispatch behaviour)."
      fi

release:
  stage: release
  tags: [docker]
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  needs:
    - build
    - installer
    - launcher:windows
  script:
    - echo "Creating the GitLab release for $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: "Esdeath Cryostasis $CI_COMMIT_TAG"
    assets:
      links:
        - name: EsdeathCryostasisSetup.exe
          url: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/esdeath-cryostasis/${CI_COMMIT_TAG}/EsdeathCryostasisSetup.exe
          link_type: package
        - name: esdeath-launcher-windows-amd64.exe
          url: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/esdeath-cryostasis/${CI_COMMIT_TAG}/esdeath-launcher-windows-amd64.exe
          link_type: package
        # MOD_JAR comes from the build job's dotenv report. The launcher looks for a
        # link whose name ends in .jar to install the mod, so this one is not optional.
        - name: $MOD_JAR
          url: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/esdeath-cryostasis/${CI_COMMIT_TAG}/${MOD_JAR}
          link_type: package
        # Named so it cannot be mistaken for a file: the engine matches assets by name, and a
        # link called "mod jar" or "launcher" would be picked up as one.
        - name: Browse every file in the package registry
          url: ${CI_PROJECT_URL}/-/packages
          link_type: other
